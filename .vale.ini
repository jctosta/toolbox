# This repository lints its own prose with the style it ships.
#
# StylesPath points into the plugin rather than at a copy, so there is one
# source of truth: a rule change lands in the plugin and this repo's CI checks
# it on the same commit. The reasoning behind the levels below lives in
# plugins/prose-gate/skills/prose-gate/references/choosing-rules.md.
StylesPath = plugins/prose-gate/skills/prose-gate/assets/styles

# What Vale prints. What blocks is `--minAlertLevel=error`, passed by CI and by
# the editing hook, so a human running `vale .` still sees the warning tier.
MinAlertLevel = warning

Vocab = Project

[*.md]
BasedOnStyles = Agentic

# Terse, list-shaped, and not read top to bottom.
[CHANGELOG.md]
BasedOnStyles = Agentic
Agentic.Readability = NO

# Documentation *about* the rules. These files teach the style by quoting the
# phrases it bans - agents-snippet.md is literally the list of what not to
# write, and choosing-rules.md names TODO and lorem ipsum to explain them. Every
# hit here is mention rather than use, which no regex can tell apart.
#
# Only the rules that fire on quoted examples are off. Length, readability,
# hedging and passive voice still apply, so the prose itself stays governed.
#
# Scoped to markdown. A bare `**` also matches the shipped shell scripts and
# rule files, and linting a shell script as prose flags things like the `fi`
# that closes two nested blocks.
[plugins/prose-gate/skills/prose-gate/**/*.md]
BasedOnStyles = Agentic
Agentic.Preamble = NO
Agentic.Narration = NO
Agentic.Signoff = NO
Agentic.Marketing = NO
Agentic.NotXButY = NO
Agentic.Placeholder = NO
Agentic.Rhetorical = NO

# Deliberately bad prose: the fixture exists to trip every rule in the style.
# This section must stay LAST. Vale applies matching sections in file order and
# the later one wins, so the broader `**` section above would otherwise switch
# the style back on for the fixture.
[plugins/prose-gate/skills/prose-gate/assets/testdata/*]
BasedOnStyles =
