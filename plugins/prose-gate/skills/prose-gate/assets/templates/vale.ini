# Prose gate for <project>.
# The reasoning behind every line here lives in docs/quality/prose-policy.md.
# Change the policy first, then change this file.

# Where the rules live. Two arrangements, and `apply` picks one deliberately:
#
#   1. Point at the installed plugin - one source of truth, rules arrive with
#      plugin updates, nothing to keep in sync. Right when the shipped style is
#      used as-is. The path below is an example; it must resolve from the repo
#      root, so a relative path is fragile if the plugin moves.
#   2. Copy the styles into the repo and point here - the repo owns its rules
#      and can edit them. Required as soon as a rule is narrowed or fixed,
#      because the fix belongs in version control next to the prose.
StylesPath = styles

# What Vale PRINTS. Not what blocks. Each surface passes its own
# --minAlertLevel, so leaving this at `warning` lets a human running `vale .`
# see the reporting tier while only errors fail a build.
MinAlertLevel = warning

# Project nouns that would otherwise trip a rule - a product genuinely called
# "Seamless", a tool whose name reads as a misspelling. Entries are regexes,
# one per line, in styles/config/vocabularies/Project/accept.txt.
# Keep it short: a long accept list usually means a rule is wrong.
Vocab = Project

# --- prose ----------------------------------------------------------------

[*.{md,mdx,txt,adoc,rst}]
BasedOnStyles = Agentic

# --- changelogs and commit messages ---------------------------------------
# Written to a different standard: terse, list-shaped, and not read top to
# bottom. Grading them for readability measures the wrong thing.

[{COMMIT_EDITMSG,CHANGELOG.md,PULL_REQUEST_TEMPLATE.md}]
BasedOnStyles = Agentic
Agentic.Readability = NO

# --- source-code comments -------------------------------------------------
# Vale reads only the comments, never the code. Comments are short and often
# deliberately terse, so the length and readability rules do not apply, and
# Placeholder is off because a TODO in code is tracked work rather than an
# unfinished document.

[*.{go,py,ts,tsx,js,jsx,rs,java,rb,sh,yml,yaml}]
BasedOnStyles = Agentic
Agentic.SentenceLength = NO
Agentic.ParagraphLength = NO
Agentic.Readability = NO
Agentic.Passive = NO
Agentic.Placeholder = NO

# --- path overrides -------------------------------------------------------
# One section per exception the policy approved, each with the reason. Every
# rule named here must exist in the styles tree; `vale_advisor.py verify`
# checks that, because a renamed rule fails silently.

# Deliberately bad prose that exists to test the style.
# [testdata/**]
# BasedOnStyles =

# The rules themselves, when the styles are vendored into the repo. A style
# trips its own patterns: Preamble.yml contains "let's dive into" and
# Signoff.yml contains "hope this helps", because those are what they match.
# Uncomment whenever StylesPath points inside the repo, and keep it last -
# Vale applies matching sections in file order and the later one wins.
# [styles/**]
# BasedOnStyles =

# Generated from source; no human controls this text.
# [docs/api/**]
# BasedOnStyles =

# Reference material for engineers; a grade-level target is the wrong measure.
# [docs/reference/**]
# Agentic.Readability = NO
